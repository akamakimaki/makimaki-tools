<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>マキマキツール</title>

    <meta name="description" content="ゲーム・Blueskyフィード・アンケート・プライベート投稿をまとめたマキマキツール">

    <meta name="theme-color" content="#ffffff">

    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css?v=20260929-1">

    <link rel="icon" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
</head>

<body>
    <div class="app-shell">

        <header class="site-header">
            <div class="brand">
                <a class="brand-logo" href="./index.html" aria-label="マキマキツール ホーム">
                    <img src="./images/header.png" alt="マキマキツール">
                </a>
            </div>
        </header>

        <main>

            <section class="game-section" aria-labelledby="games-title">

                <div class="section-heading">
                    <span class="section-icon" aria-hidden="true">🎮</span>
                    <span class="section-label">GAME</span>
                    <h2 id="games-title">ゲーム</h2>
                </div>

                <div class="game-grid">

                    <!-- おはにげ -->
                    <a class="game-card" href="./games/ohaginige/">
                        <div class="game-visual">
                            <img class="game-character" src="./images/giyu-normal.png" alt="" aria-hidden="true">
                        </div>

                        <div class="game-card-footer">
                            <span>おはぎから逃げろ！</span>
                            <span aria-hidden="true">→</span>
                        </div>
                    </a>

                    <!-- おはぎDROP -->
                    <a class="game-card" href="./games/ohagidoro/">
                        <div class="game-visual">
                            <img class="game-character" src="./images/ohagi-drop.png" alt="" aria-hidden="true">
                            <img class="game-title-logo" src="./images/title-drop.png" alt="おはぎDROP">
                        </div>

                        <div class="game-card-footer">
                            <span>おはぎDROP</span>
                            <span aria-hidden="true">→</span>
                        </div>
                    </a>

                    <!-- おはぎKISS -->
                    <a class="game-card" href="./games/ohakiss/">
                        <div class="game-visual">
                            <img class="game-character" src="./images/ohagi-kiss-giyusane.png" alt=""
                                aria-hidden="true">
                            <img class="game-title-logo" src="./images/title-kiss.png" alt="おはぎKISS">
                        </div>

                        <div class="game-card-footer">
                            <span>おはぎKISS</span>
                            <span aria-hidden="true">→</span>
                        </div>
                    </a>

                    <!-- おはぎPUSH -->
                    <a class="game-card" href="https://akamakimaki.github.io/ohagi-push/">
                        <div class="game-visual">
                            <img class="game-character" src="./images/ohagi-push-giyusane.png" alt=""
                                aria-hidden="true">

                            <img class="game-title-logo push-title-logo" src="./images/title-push.png" alt="おはぎを押しつけろ！">
                        </div>

                        <div class="game-card-footer">
                            <span>おはぎを押しつけろ！</span>
                            <span aria-hidden="true">→</span>
                        </div>
                    </a>

                </div>

                <div class="record-links">

                    <a class="record-link" href="https://ohagi-ranking.makimaki-feed.net/stats.html">
                        <span aria-hidden="true">📊</span>
                        <span>みんなの記録</span>
                    </a>

                    <a class="record-link" href="https://ohagi-ranking.makimaki-feed.net/?game=kiss&amp;view=mine">
                        <span aria-hidden="true">👤</span>
                        <span>自分の記録</span>
                    </a>

                </div>

            </section>

            <section class="tool-section" aria-labelledby="bluesky-title">

                <div class="section-heading">
                    <span class="section-icon" aria-hidden="true">🦋</span>
                    <h2 id="bluesky-title">Bluesky</h2>
                </div>

                <div class="tool-grid">

                    <a class="tool-card" href="./feeds.html" id="feed-link">
                        <div class="tool-card-icon" aria-hidden="true">📰</div>

                        <div class="tool-card-body">
                            <h3>フィード</h3>
                            <p>カスタムフィード一覧</p>
                        </div>

                        <span class="tool-card-arrow" aria-hidden="true">›</span>
                    </a>

                    <a class="tool-card" href="https://poll.makimaki-feed.net/" id="poll-link" target="_blank"
                        rel="noopener noreferrer">

                        <div class="tool-card-icon" aria-hidden="true">📊</div>

                        <div class="tool-card-body">
                            <h3>アンケート</h3>
                            <p>ログイン不要の投票ツール</p>
                        </div>

                        <span class="tool-card-arrow" aria-hidden="true">›</span>
                    </a>

                    <a class="tool-card" href="https://private.makimaki-feed.net/private" id="private-link">

                        <div class="tool-card-icon" aria-hidden="true">🔒</div>

                        <div class="tool-card-body">
                            <h3>プライベート投稿</h3>
                            <p>限定公開用の投稿ツール</p>
                        </div>
                        <span class="tool-card-arrow" aria-hidden="true">›</span>
                    </a>

                    <a class="tool-card" href="https://link.makimaki-feed.net/" id="makimaki-link" target="_blank"
                        rel="noopener noreferrer">

                        <div class="tool-card-icon" aria-hidden="true">🔗</div>

                        <div class="tool-card-body">
                            <h3>マキマキリンク</h3>
                            <p>同人活動向けリンク＆作品展示ページ</p>
                        </div>

                        <span class="tool-card-arrow" aria-hidden="true">›</span>
                    </a>

                </div>

            </section>

        </main>

        <footer style="padding: 24px 16px; text-align: center; font-size: 12px;">
            <a href="https://makimaki-feed.net/policy.html" target="_blank" rel="noopener noreferrer">
                プライバシーポリシー
            </a>
        </footer>

        <footer class="site-footer">
            <a href="./policy.html">プライバシーポリシー</a>
        </footer>

    </div>

    <script src="./app.js"></script>
</body>

</html>
